name: Build Deathpool AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Generate All Project Files
      run: |
        # 1. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Deathpool AI"
        include(":app")
        EOF

        # 2. root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 3. Create Folder Paths
        mkdir -p app/src/main/java/com/deathpool/ai

        # 4. app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.deathpool.ai"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.deathpool.ai"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }

            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
            packaging {
                resources {
                    excludes += "/META-INF/{AL2.0,LGPL2.1}"
                }
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
        }
        EOF

        # 5. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application
                android:allowBackup="true"
                android:label="Deathpool AI"
                android:theme="@android:style/Theme.Material.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. MainActivity.kt (Gemini UI + Offline Voice & Automation)
        cat << 'EOF' > app/src/main/java/com/deathpool/ai/MainActivity.kt
        package com.deathpool.ai

        import android.content.Intent
        import android.os.Bundle
        import android.speech.tts.TextToSpeech
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.ArrowUpward
        import androidx.compose.material.icons.filled.AutoAwesome
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Brush
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.lifecycle.lifecycleScope
        import kotlinx.coroutines.launch
        import java.util.Locale

        data class ChatMessage(val sender: String, val text: String, val isUser: Boolean)

        class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {
            private lateinit var tts: TextToSpeech

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                tts = TextToSpeech(this, this)

                setContent {
                    val messages = remember { mutableStateListOf<ChatMessage>() }
                    var isProcessing by remember { mutableStateOf(false) }

                    fun submitQuery(userText: String) {
                        messages.add(ChatMessage("User", userText, true))
                        isProcessing = true

                        lifecycleScope.launch {
                            val lower = userText.lowercase()
                            isProcessing = false

                            when {
                                lower.contains("youtube") -> {
                                    val intent = packageManager.getLaunchIntentForPackage("com.google.android.youtube")
                                    if (intent != null) startActivity(intent)
                                    val reply = "YouTube open kar raha hu."
                                    messages.add(ChatMessage("Deathpool", reply, false))
                                    speak(reply)
                                }
                                lower.contains("whatsapp") -> {
                                    val intent = packageManager.getLaunchIntentForPackage("com.whatsapp")
                                    if (intent != null) startActivity(intent)
                                    val reply = "WhatsApp launch kar diya hai."
                                    messages.add(ChatMessage("Deathpool", reply, false))
                                    speak(reply)
                                }
                                lower.contains("short") || lower.contains("video") -> {
                                    val reply = "Shorts automation module active! Ready for video crop."
                                    messages.add(ChatMessage("Deathpool", reply, false))
                                    speak(reply)
                                }
                                else -> {
                                    val reply = "Main Deathpool AI hu. Offline mode me aapke 12GB RAM hardware par ready hu!"
                                    messages.add(ChatMessage("Deathpool", reply, false))
                                    speak(reply)
                                }
                            }
                        }
                    }

                    GeminiDashboard(messages, isProcessing, onSend = { submitQuery(it) })
                }
            }

            private fun speak(text: String) {
                tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AI_VOICE")
            }

            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) tts.language = Locale("hi", "IN")
            }

            override fun onDestroy() {
                tts.stop()
                tts.shutdown()
                super.onDestroy()
            }
        }

        @Composable
        fun GeminiDashboard(messages: List<ChatMessage>, isProcessing: Boolean, onSend: (String) -> Unit) {
            var textInput by remember { mutableStateOf("") }
            val darkBg = Color(0xFF131314)
            val cardBg = Color(0xFF1E1F20)
            val geminiGradient = Brush.horizontalGradient(listOf(Color(0xFF4E85DE), Color(0xFF9B72CB), Color(0xFFD96570)))

            Scaffold(
                containerColor = darkBg,
                topBar = {
                    Row(
                        modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 16.dp),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text("DEATHPOOL AI", style = MaterialTheme.typography.titleMedium.copy(fontWeight = FontWeight.Bold, brush = geminiGradient))
                        Icon(Icons.Default.AutoAwesome, contentDescription = null, tint = Color(0xFF4E85DE))
                    }
                },
                bottomBar = {
                    Row(
                        modifier = Modifier.fillMaxWidth().padding(16.dp).clip(RoundedCornerShape(32.dp)).background(cardBg).padding(horizontal = 12.dp, vertical = 4.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        TextField(
                            value = textInput,
                            onValueChange = { textInput = it },
                            placeholder = { Text("Command likhein...", color = Color.Gray, fontSize = 14.sp) },
                            modifier = Modifier.weight(1f),
                            colors = TextFieldDefaults.colors(
                                focusedContainerColor = Color.Transparent,
                                unfocusedContainerColor = Color.Transparent,
                                focusedTextColor = Color.White,
                                unfocusedTextColor = Color.White
                            )
                        )
                        IconButton(
                            onClick = {
                                if (textInput.isNotBlank()) {
                                    onSend(textInput)
                                    textInput = ""
                                }
                            },
                            modifier = Modifier.size(40.dp).clip(CircleShape).background(geminiGradient)
                        ) {
                            Icon(Icons.Default.ArrowUpward, contentDescription = "Send", tint = Color.White)
                        }
                    }
                }
            ) { p ->
                LazyColumn(modifier = Modifier.fillMaxSize().padding(p).padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    items(messages) { msg ->
                        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = if (msg.isUser) Arrangement.End else Arrangement.Start) {
                            Box(modifier = Modifier.clip(RoundedCornerShape(16.dp)).background(if (msg.isUser) Color(0xFF2B2C2F) else cardBg).padding(12.dp)) {
                                Text(msg.text, color = Color.White, fontSize = 14.sp)
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Deathpool-AI-APK
        path: app/build/outputs/apk/debug/*.apk
        
